<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ロト7予想">
<meta name="theme-color" content="#c0392b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>ロト7予想</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>ロト7予想 <span id="ver"></span></h1></header>
<main>
  <section class="card">
    <div class="row">
      <button id="btnFetch" class="primary">当選番号を取り込む</button>
      <span id="status" class="muted"></span>
    </div>
  </section>

  <section class="card" id="secPrev" hidden>
    <h2>前回の当選数字 <small id="prevLabel"></small></h2>
    <div id="prevBalls" class="balls"></div>
  </section>

  <section class="card" id="secLaws" hidden>
    <h2>6つの法則の設定</h2>
    <div class="laws">
      <label><input type="checkbox" id="lawAxis" checked> ① 軸数字を入れる（直近<select id="axisWindow"><option>24</option><option selected>50</option><option>100</option></select>回でよく出る上位<select id="axisTop"><option>5</option><option selected>10</option><option>15</option></select>個から<select id="axisMin"><option selected>1</option><option>2</option></select>つ以上）</label>
      <label><input type="checkbox" id="lawDigit" checked> ② 下一桁が同じペアを入れる</label>
      <label><input type="checkbox" id="lawPrev" checked> ③ 引っ張りを入れる（前回<select id="prevMin"><option selected>1</option><option>2</option></select>つ以上）</label>
      <label class="sub"><input type="checkbox" id="lawPrev2"> 前々回の数字も対象にする</label>
      <label><input type="checkbox" id="lawAdj" checked> ④ 前後の数字（±1）を<select id="adjMin"><option selected>1</option><option>2</option></select>つ以上入れる</label>
      <label><input type="checkbox" id="lawOddEven" checked> ⑤ 奇数と偶数を3対4か4対3にする</label>
      <label><input type="checkbox" id="lawPos" checked> ⑥ 位置ごとの数字の範囲で絞る</label>
    </div>
    <p class="muted" id="posNote">第1数字は1〜15、第7数字は29〜37のように、並べたときの位置で範囲を決めます。</p>
  </section>

  <section class="card" id="secMake" hidden>
    <h2>数字を選ぶ</h2>
    <div class="row">
      <label>選び方 <select id="mode"><option value="six" selected>6つの法則</option><option value="four">4つの黄金法則（今までの）</option></select></label>
      <label>何通り <select id="sets"><option>1</option><option>3</option><option selected>5</option><option>10</option></select></label>
      <button id="btnMake" class="primary">数字を選ぶ</button>
    </div>
    <div class="legend" id="legend"></div>
    <div id="results"></div>
    <div class="row" id="saveRow" hidden>
      <button id="btnSave">この予想を保存</button>
      <span class="muted">次回（第<span id="nextNo"></span>回）の結果が出たら答え合わせできます</span>
    </div>
    <p class="note">抽選は毎回ランダムです。この法則で当たりやすくなる保証はありません。</p>
  </section>

  <section class="card" id="secSaved" hidden>
    <h2>保存した予想と答え合わせ</h2>
    <div id="savedList"></div>
  </section>

  <section class="card" id="secRule1" hidden>
    <h2>① 直近24回で出た回数 <small id="rangeLabel"></small></h2>
    <p class="muted">赤枠が3〜4回（狙い目）：<span id="hotList"></span></p>
    <div id="countGrid" class="grid"></div>
  </section>

  <section class="card" id="secRule3" hidden>
    <h2>③ 連続数字の候補（前回の数字の前後）</h2>
    <div id="consecList" class="chips"></div>
  </section>

  <section class="card" id="secHist" hidden>
    <details>
      <summary>取り込んだ当選番号（直近24回）</summary>
      <table id="histTable"><thead><tr><th>回</th><th>日付</th><th>本数字</th><th>ボーナス</th></tr></thead><tbody></tbody></table>
    </details>
  </section>
<p class="backlink"><a href="win5.html">WIN5予想へ</a></p>
</main>
<script src="rules.js"></script>
<script src="rules6.js"></script>
<script src="app.js"></script>
</body>
</html>
