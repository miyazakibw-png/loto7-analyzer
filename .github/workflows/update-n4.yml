name: ナンバーズ4当選番号を更新
on:
  schedule:
    - cron: '45 10 * * 1-5'   # 平日 19:45 JST（抽選後）
    - cron: '0 0 * * 2-6'     # 翌朝 9:00 JST（保険）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-n4.js
      - name: commit if changed
        run: |
          if git diff --quiet data/numbers4.json; then echo "no change"; exit 0; fi
          git config user.name "loto7-bot"
          git config user.email "loto7-bot@users.noreply.github.com"
          git add data/numbers4.json
          git commit -m "ナンバーズ4当選番号を更新"
          git pull --rebase origin main
          git push origin HEAD:main
