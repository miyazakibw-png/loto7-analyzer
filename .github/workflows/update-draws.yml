name: 当選番号の取り込み
on:
  push:
    paths-ignore:
      - "data/draws.json"
  schedule:
    - cron: '15 12 * * 5'   # 金曜 21:15 JST（抽選日の夜）
    - cron: '15 0 * * 6'    # 土曜  9:15 JST（取り残し用）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node scripts/fetch.js
      - name: commit if changed
        run: |
          if git diff --quiet data/draws.json; then
            echo "no change"; exit 0
          fi
          git config user.name "loto7-bot"
          git config user.email "loto7-bot@users.noreply.github.com"
          git add data/draws.json
          git commit -m "当選番号を更新（$(node -e "console.log('第'+require('./data/draws.json').draws[0].no+'回')")）"
          git push origin HEAD:main
